apiVersion: mongodb.com/v1
kind: MongoDBSearch
metadata:
  name: replica-set
  namespace: mongodb-operator
spec:
  replicas: 2
  loadBalancer:
    managed: {}
  resourceRequirements:
    limits:
      cpu: "3"
      memory: 5Gi
    requests:
      cpu: "2"
      memory: 3Gi
  statefulSet:
    spec:
      template:
        spec:
          nodeSelector:
            workload: search
          tolerations:
            - key: dedicated
              operator: Equal
              value: search
              effect: NoSchedule